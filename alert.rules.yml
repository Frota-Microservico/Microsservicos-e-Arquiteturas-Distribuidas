groups:
  # ========== ALERTAS DE SISTEMA ==========
  - name: system_alerts
    interval: 30s
    rules:
      # Alerta de CPU alta
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "CPU alta no host {{ $labels.instance }}"
          description: "O uso de CPU está em {{ $value }}% há mais de 5 minutos."

      # Alerta de memória alta
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Memória alta no host {{ $labels.instance }}"
          description: "O uso de memória está em {{ $value }}% há mais de 5 minutos."

      # Alerta de disco cheio
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Espaço em disco baixo"
          description: "Apenas {{ $value }}% de espaço disponível no disco."

  # ========== ALERTAS DE CONTAINERS ==========
  - name: container_alerts
    interval: 30s
    rules:
      # Container parado/falha
      - alert: ContainerDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          category: container
        annotations:
          summary: "Container {{ $labels.job }} está down"
          description: "O container {{ $labels.job }} não está respondendo há mais de 2 minutos."

      # CPU alta em container
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "CPU alta no container {{ $labels.name }}"
          description: "O container {{ $labels.name }} está usando {{ $value }}% de CPU."

      # Memória alta em container
      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "Memória alta no container {{ $labels.name }}"
          description: "O container {{ $labels.name }} está usando {{ $value }}% de memória."

  # ========== ALERTAS DE APLICAÇÃO NODE.JS ==========
  - name: nodejs_alerts
    interval: 30s
    rules:
      # Taxa de erro alta
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
          category: application
        annotations:
          summary: "Taxa de erro alta em {{ $labels.service }}"
          description: "O serviço {{ $labels.service }} está com {{ $value }} erros por segundo."

      # Latência alta
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "Latência alta em {{ $labels.service }}"
          description: "O p95 da latência do {{ $labels.service }} é {{ $value }}s."

      # Muitas requisições
      - alert: HighRequestRate
        expr: rate(http_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: info
          category: application
        annotations:
          summary: "Taxa de requisições alta"
          description: "{{ $labels.service }} está recebendo {{ $value }} requisições por segundo."

  # ========== ALERTAS DO POSTGRESQL ==========
  - name: postgres_alerts
    interval: 30s
    rules:
      # Postgres Down
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "PostgreSQL está down"
          description: "O banco de dados PostgreSQL não está respondendo."

      # Muitas conexões ativas
      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Muitas conexões no PostgreSQL"
          description: "O PostgreSQL tem {{ $value }} conexões ativas."

      # Query lenta
      - alert: PostgresSlowQueries
        expr: pg_stat_activity_max_tx_duration > 300
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Queries lentas no PostgreSQL"
          description: "Detectadas queries rodando por mais de 5 minutos."

      # Replication lag (se houver replicação)
      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 30
        for: 2m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Lag de replicação no PostgreSQL"
          description: "O lag de replicação está em {{ $value }} segundos."

  # ========== ALERTAS DO KAFKA ==========
  - name: kafka_alerts
    interval: 30s
    rules:
      # Kafka Down
      - alert: KafkaDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
          category: messaging
        annotations:
          summary: "Kafka está down"
          description: "O Kafka não está respondendo."

      # Mensagens acumuladas (lag)
      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag > 1000
        for: 5m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "Lag alto no consumer do Kafka"
          description: "O consumer group {{ $labels.consumergroup }} tem {{ $value }} mensagens em atraso."

      # Partições offline
      - alert: KafkaOfflinePartitions
        expr: kafka_controller_kafkacontroller_offlinepartitionscount > 0
        for: 2m
        labels:
          severity: critical
          category: messaging
        annotations:
          summary: "Partições offline no Kafka"
          description: "Há {{ $value }} partições offline no Kafka."

      # ISR (In-Sync Replicas) baixo
      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_cluster_partition_underminisr > 0
        for: 5m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "Partições sub-replicadas no Kafka"
          description: "Há {{ $value }} partições com replicação abaixo do mínimo."
