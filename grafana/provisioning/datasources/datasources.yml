apiVersion: 1

datasources:
  # Prometheus
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
    version: 1

  # Loki (Logs)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
    version: 1

  # PostgreSQL (opcional - para queries diretas)
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: dcs-postgres:5432
    database: gerenciador_frota
    user: gerenciador_frota_user
    secureJsonData:
      password: root
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    editable: true
    version: 1
