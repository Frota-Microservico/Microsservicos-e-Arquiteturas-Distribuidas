global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se auto-monitora
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Reserva Service
  - job_name: 'reserva-service'
    static_configs:
      - targets: ['reserva-service:3001']
        labels:
          service: 'reserva'
          type: 'nodejs'
  # Veiculo Service
  - job_name: 'veiculo-service'
    static_configs:
      - targets: ['veiculo-service:3002']
        labels:
          service: 'veiculo'
          type: 'nodejs'

  # User Service
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3003']
        labels:
          service: 'user'
          type: 'nodejs'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'Docker Host'

