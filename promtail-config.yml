server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Coleta de logs dos containers Docker
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    
    relabel_configs:
      # Nome do container
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      
      # Label de serviço
      - source_labels: ['__meta_docker_container_label_service']
        target_label: 'service'
      
      # ID do container
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      
      # Nome da imagem
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
      
      # Rede do container
      - source_labels: ['__meta_docker_container_network_mode']
        target_label: 'network'

  # Logs do sistema
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  # Logs específicos dos microserviços (se logar em arquivo)
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: app-logs
          app: fleet-manager
          __path__: /var/log/app/*.log

# Pipeline de processamento de logs
pipeline_stages:
  # Extração de nível de log
  - regex:
      expression: '.*level=(?P<level>\w+).*'
  - labels:
      level:

  # Extração de timestamp
  - timestamp:
      source: timestamp
      format: RFC3339Nano

  # Extração de JSON (para logs estruturados)
  - json:
      expressions:
        level: level
        msg: message
        service: service
        timestamp: timestamp

  # Métricas extraídas dos logs
  - metrics:
      error_count:
        type: Counter
        description: "Total de erros nos logs"
        source: level
        config:
          value: error
          action: inc

      warning_count:
        type: Counter
        description: "Total de warnings nos logs"
        source: level
        config:
          value: warning
          action: inc
