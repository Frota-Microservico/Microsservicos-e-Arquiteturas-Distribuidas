services:
  dcs-postgres:
    image: postgres:15.3-alpine
    container_name: postgres_gerenciador_frota
    restart: always
    environment:
      POSTGRES_USER: gerenciador_frota_user
      POSTGRES_PASSWORD: root
      POSTGRES_DB: gerenciador_frota
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gerenciador_frota_user -d gerenciador_frota"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gerenciador_frota
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@reserva.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - dcs-postgres
    networks:
      - fleet-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fleet-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Kafka UI
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - fleet-network

  # Microserviços
  reserva-service:
    build:
      context: ./ReservaService
    container_name: reserva-service
    restart: always
    environment:
      PORT: 3001
      DB_HOST: dcs-postgres
      DB_PORT: 5432
      DB_USER: gerenciador_frota_user
      DB_PASSWORD: root
      DB_NAME: gerenciador_frota
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: m1p4ssw0rd
    depends_on:
      dcs-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - fleet-network

  veiculo-service:
    build:
      context: ./VeiculoService
    container_name: veiculo-service
    restart: always
    environment:
      PORT: 3002
      DB_HOST: dcs-postgres
      DB_PORT: 5432
      DB_USER: gerenciador_frota_user
      DB_PASSWORD: root
      DB_NAME: gerenciador_frota
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: m1p4ssw0rd
    depends_on:
      dcs-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3002:3002"
    networks:
      - fleet-network

  user-service:
    build:
      context: ./UserService
    container_name: user-service
    restart: always
    environment:
      PORT: 3003
      DB_HOST: dcs-postgres
      DB_PORT: 5432
      DB_USER: gerenciador_frota_user
      DB_PASSWORD: root
      DB_NAME: gerenciador_frota
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: m1p4ssw0rd
    depends_on:
      dcs-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3003:3003"
    networks:
      - fleet-network

  historico-service:
    build:
      context: ./HistoricoService
    container_name: historico-service
    restart: always
    environment:
      PORT: 3004
      DB_HOST: dcs-postgres
      DB_PORT: 5432
      DB_USER: gerenciador_frota_user
      DB_PASSWORD: root
      DB_NAME: gerenciador_frota
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: m1p4ssw0rd
    depends_on:
      dcs-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3004:3004"
    networks:
      - fleet-network

  notificacao-service:
    build:
      context: ./NotificacaoService
    container_name: notificacao-service
    restart: always
    environment:
      PORT: 3005
      DB_HOST: dcs-postgres
      DB_PORT: 5432
      DB_USER: gerenciador_frota_user
      DB_PASSWORD: root
      DB_NAME: gerenciador_frota
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: m1p4ssw0rd
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      EMAIL_USER: frotamicroservico@gmail.com
      EMAIL_PASS: rrfnxscfdlzvpwys
    depends_on:
      dcs-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3005:3005"
    networks:
      - fleet-network

  devolucao-service:
    build:
      context: ./DevolucaoService
    container_name: devolucao-service
    restart: always
    environment:
      PORT: 3006
      DB_HOST: dcs-postgres
      DB_PORT: 5432
      DB_USER: gerenciador_frota_user
      DB_PASSWORD: root
      DB_NAME: gerenciador_frota
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: m1p4ssw0rd
    depends_on:
      dcs-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3006:3006"
    networks:
      - fleet-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
    volumes:
      # Dados persistentes do Grafana
      - grafana-data:/var/lib/grafana
      
      # Datasources (Prometheus, Loki, PostgreSQL)
      - ./grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      
      # Configuração de dashboards
      - ./grafana/provisioning/dashboards/dashboard-config.yml:/etc/grafana/provisioning/dashboards/dashboard-config.yml
      
      # Dashboards JSON (pasta inteira)
      - ./grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    networks:
      - fleet-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus-data:/prometheus
    networks:
      - fleet-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    networks:
      - fleet-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - fleet-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - fleet-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/host/root'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - fleet-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - fleet-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: always
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://gerenciador_frota_user:root@dcs-postgres:5432/gerenciador_frota?sslmode=disable"
    depends_on:
      dcs-postgres:
        condition: service_healthy
    networks:
      - fleet-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: always
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:9092'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fleet-network

networks:
  fleet-network:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  alertmanager-data:
  grafana-data: